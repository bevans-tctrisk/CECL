{% extends "base.html" %}
{% block title %}Executive Summary — {{ page.credit_union }}{% endblock %}
{% block body %}
<section class="page impr-deter">

  <header class="rpt-header">
    <div class="rpt-cu">{{ page.credit_union }}</div>
    {% for line in page.heading_lines %}
    <div class="rpt-subhead">{{ line }}</div>
    {% endfor %}
  </header>

  {% if charts %}
  <div class="charts-grid impr-charts">
    {% for svg in charts %}<div class="chart-cell">{{ svg | safe }}</div>{% endfor %}
  </div>
  {% endif %}

</section>
{% endblock %}
